name: Documentation theme

on:
  push:
    branches: [main]
    paths: ['index.html', 'docs-theme/**', 'tests/**', '.github/workflows/docs-theme.yml']
  pull_request:
    paths: ['index.html', 'docs-theme/**', 'tests/**', '.github/workflows/docs-theme.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-theme-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: ${{ matrix.project }} (${{ matrix.sha }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - project: pypto
            sha: 812628941a4ad118321e097ced984e9ec383203e
            python: '3.11'
            page: api/tile/index.html
          - project: simpler
            sha: 405b5bbda30f6d0f6167e4b2f283df2d42ca3443
            python: '3.10'
            page: user/reference/api/worker/index.html
          - project: pypto-lib
            sha: 216b497e4b7d8bb7b47e304e79fd59e01de2a2e9
            python: '3.10'
            page: get-started/first-kernel/index.html
          - project: pypto-serving
            sha: 967c839c22402cb3f23c7430129ce539a0accbdf
            python: '3.11'
            page: user-guide/online-serving/index.html
          - project: pypto-tools
            sha: 955cfcfc01c7028f0e9bef01b3fdabc04e90de9e
            python: '3.11'
            page: runtime/chip-swimlane/index.html
    steps:
      - uses: actions/checkout@v4
        with:
          path: theme
      - name: Check out fixed downstream snapshot
        uses: actions/checkout@v4
        with:
          repository: hw-native-sys/${{ matrix.project }}
          ref: ${{ matrix.sha }}
          path: downstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install shared renderer
        run: python -m pip install -r theme/docs-theme/constraints.txt
      - name: Prepare candidate theme configuration
        run: >-
          python theme/tests/docs_theme_compat.py prepare
          --repo downstream --project '${{ matrix.project }}'
          --expected-sha '${{ matrix.sha }}'
      - name: Install project documentation plugins
        # Toolkit's temporary requirements test the 9.7.7 candidate explicitly;
        # no upstream dependency file or source config is changed.
        run: >-
          python -m pip install -c theme/docs-theme/constraints.txt
          -r downstream/requirements-theme-compat.txt
      - name: Record tested source and toolchain
        run: |
          git -C downstream rev-parse HEAD
          python --version
          python -m pip freeze
          python -m pip check
      - name: Run existing documentation checks and strict build
        working-directory: downstream
        env:
          DOCS_REF: ${{ matrix.sha }}
        run: |
          if [ -f .claude/skills/testing/load-env.sh ]; then
            source .claude/skills/testing/load-env.sh
          fi
          for check in check_docs_nav check_public_docs check_docs_en_zh_parity check_docs_symbol_coverage check_op_docstring_parity; do
            if [ -f "tests/lint/$check.py" ]; then
              python "tests/lint/$check.py"
            fi
          done
          if [ -f tests/docs/test_repo_links.py ]; then
            python -m unittest discover -s tests/docs -v
          fi
          mkdocs build --strict -f mkdocs.theme-compat.yml --site-dir site-theme
      - name: Validate rendered branding, links, and assets
        run: >-
          python theme/tests/docs_theme_compat.py check
          --site downstream/site-theme --project '${{ matrix.project }}'
          --page '${{ matrix.page }}'
      - name: Upload review preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-theme-${{ matrix.project }}-${{ matrix.sha }}
          path: downstream/site-theme
          retention-days: 7
      - name: Install browser checks
        if: matrix.project == 'pypto'
        run: |
          python -m pip install -r theme/tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Check homepage and bilingual PyPTO in Chromium
        if: matrix.project == 'pypto'
        env:
          PYPTO_DOCS_SITE: ${{ github.workspace }}/downstream/site-theme
        run: python -m pytest theme/tests/test_browser_theme.py -q
