name: Central documentation pilot

on:
  pull_request:
    paths: ['scripts/docs_site.py', 'tests/test_docs_site.py', '.github/workflows/docs-site.yml', 'docs-theme/**', 'index.html']
  push:
    branches: [main]
    paths: ['scripts/docs_site.py', '.github/workflows/docs-site.yml', 'docs-theme/**', 'index.html']
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      source_repository:
        description: 'Notification source repository (leave all source inputs empty for a manual build)'
        type: string
        default: ''
      source_sha:
        description: 'Source Docs run head SHA'
        type: string
        default: ''
      source_run_id:
        description: 'Completed source Docs run ID'
        type: string
        default: ''
      source_run_attempt:
        description: 'Completed source Docs run attempt'
        type: string
        default: ''

permissions:
  contents: read

# PR validation cannot cancel or queue behind production publication.
concurrency:
  group: docs-site-${{ github.event_name == 'pull_request' && github.ref || 'publication' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: >-
      github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' ||
      (github.repository == 'hw-native-sys/hw-native-sys.github.io' && vars.DOCS_SITE_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pilot checks
        run: python -m pip install -r tests/requirements.txt
      - name: Test notification validation and publication guards
        run: python -m pytest tests/test_docs_site.py -q
      - name: Resolve successful upstream documentation snapshot
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
        run: python scripts/docs_site.py resolve --manifest .docs-build/manifest.json
      - name: Check out selected PyPTO source
        uses: actions/checkout@v4
        with:
          repository: hw-native-sys/pypto
          ref: ${{ steps.source.outputs.source_sha }}
          path: .docs-build/pypto
          persist-credentials: false
      - name: Supply the central theme
        run: python scripts/docs_site.py prepare --manifest .docs-build/manifest.json --checkout .docs-build/pypto
      - name: Install project documentation toolchain
        run: python -m pip install -r .docs-build/pypto/docs/requirements.txt
      - name: Check and build the selected source
        working-directory: .docs-build/pypto
        env:
          DOCS_REF: ${{ steps.source.outputs.source_sha }}
        run: |
          source .claude/skills/testing/load-env.sh
          python tests/lint/check_docs_nav.py
          python tests/lint/check_docs_en_zh_parity.py
          python tests/lint/check_docs_symbol_coverage.py
          python tests/lint/check_op_docstring_parity.py
          python -m pip check
          python -m mkdocs build --strict
      - name: Check generated pages and shared resources
        run: python tests/docs_theme_compat.py check --site .docs-build/pypto/site --project pypto --page api/tile/index.html
      - name: Assemble complete pilot artifact
        run: python scripts/docs_site.py assemble --manifest .docs-build/manifest.json --checkout .docs-build/pypto --output .docs-build/public
      - name: Upload inspectable pilot artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site-pilot
          path: .docs-build/public
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Upload Pages artifact for enabled publication
        if: >-
          github.repository == 'hw-native-sys/hw-native-sys.github.io' &&
          github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
          vars.DOCS_SITE_PUBLISH == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .docs-build/public

  deploy:
    needs: build
    if: >-
      github.repository == 'hw-native-sys/hw-native-sys.github.io' &&
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      vars.DOCS_SITE_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: docs-site-pilot
          path: .docs-build/public
      - name: Reject superseded or unchanged publication
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/docs_site.py guard --manifest .docs-build/public/build-manifest.json
      - uses: actions/configure-pages@v5
        if: steps.guard.outputs.changed == 'true'
      - uses: actions/deploy-pages@v4
        id: deploy
        if: steps.guard.outputs.changed == 'true'
